<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Body Map MCAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Rubik:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: playful field expedition, but the cards stay clear and calm to read
   IDEA: an anatomy atlas you shrink into — each organ is a fogged region you chart by answering cards
   PICTURE: the glowing body map on the home screen; inside, the tile map with your nanobot is the picture
   COLOUR and TYPE: deep tissue maroon, pink membrane, one cyan for the explorer and progress; each organ its own flat hue; Fredoka + Rubik
   LAYOUT: body left / regions right (stacks on phones); region view = slim top bar, square-ish grid, legend under */
:root{color-scheme:dark;--bg:#2a0a12;--bg2:#3d1019;--tis:#5b1a27;--mem:#f2a0a8;--ink:#fbe9ea;--mute:#d6a5ab;--cy:#4fe3d6;--bad:#ff6b6b;--good:#7be0a5}
*{box-sizing:border-box;min-width:0}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(120% 60% at 30% 0%,var(--bg2),var(--bg) 70%) no-repeat;color:var(--ink);font:16px/1.55 Rubik,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
h1,h2,h3{font-family:Fredoka,Rubik,sans-serif;font-weight:600;margin:0;line-height:1.1}
button{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:clamp(18px,3vw,36px) max(4vw,14px) 40px}
.btn{min-height:44px;padding:0 18px;border-radius:12px;border:0;background:var(--cy);color:#06302d;font:600 15px Fredoka,sans-serif;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px #f2a0a855}
.btn:focus-visible,.reg:focus-visible,.tile:focus-visible,.opt:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
[hidden]{display:none!important}
/* home */
.top{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:end;justify-content:space-between;margin-bottom:18px}
.top h1{font-size:clamp(32px,5vw,48px)}.top p{margin:4px 0 0;color:var(--mute);max-width:52ch}
.home{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(16px,3vw,40px);align-items:center}
@media(max-width:760px){.home{grid-template-columns:minmax(0,1fr)}.body{max-height:48vh}}
.body{width:100%;max-height:72vh;display:block;margin:auto}
.org{cursor:pointer;transition:filter .2s}.org:hover{filter:brightness(1.25)}
.org.healed{filter:drop-shadow(0 0 10px var(--cy))}
.regs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.reg{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;text-align:left;padding:14px;border-radius:16px;border:0;background:#ffffff0d;box-shadow:inset 0 0 0 1px #f2a0a822;cursor:pointer}
.reg:hover{background:#ffffff16}
.dot{width:38px;height:38px;border-radius:50%;grid-row:span 3;box-shadow:inset 0 -6px 0 #0003}
.reg h3{font-size:18px}.reg small{color:var(--mute);font-size:13px}
.bar{height:6px;border-radius:3px;background:#ffffff1a;overflow:hidden}.bar i{display:block;height:100%;background:var(--cy)}
.stat{grid-column:2;display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.healedTag{color:var(--cy);font-weight:500}
.homefoot{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.homefoot p{margin:0;font-size:14px;color:var(--mute)}
/* region */
.rbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:12px}
.rbar h2{font-size:clamp(22px,3.5vw,30px)}.rbar .sub{color:var(--mute);font-size:14px}
.rbar .sp{flex:1}
.hp{font-size:20px;letter-spacing:2px;color:var(--bad)}
.pill{font-size:14px;padding:4px 10px;border-radius:20px;background:#ffffff12;white-space:nowrap}
.gridwrap{max-width:760px;margin:0 auto}
.grid{display:grid;gap:4px;padding:8px;border-radius:18px;background:#14040a;box-shadow:inset 0 0 0 2px #f2a0a822,0 20px 40px -20px #000}
.tile{position:relative;aspect-ratio:1;border:0;border-radius:8px;padding:0;background:radial-gradient(circle at 30% 35%,#ffffff0d 0 16%,transparent 17%) #1f070d;cursor:default;overflow:hidden}
.tile svg{position:absolute;inset:12%;width:76%;height:76%}
.tile.vis{background:color-mix(in srgb,var(--rc) 30%,#3a0f18)}
.tile.clr{background:color-mix(in srgb,var(--rc) 62%,#4a1420);box-shadow:inset 0 -4px 0 #0002}
.tile.wall.vis{background:radial-gradient(circle at 35% 30%,#7a2a3a,#3a0f18 70%);box-shadow:inset 0 0 0 2px #f2a0a830;border-radius:40%}
.tile.can{cursor:pointer;box-shadow:inset 0 0 0 2px var(--cy)}
.tile.can:hover{filter:brightness(1.3)}
.tile.inf{background:color-mix(in srgb,var(--bad) 30%,#3a0f18)}
.me{position:absolute;inset:8%;z-index:2;filter:drop-shadow(0 0 8px var(--cy))}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;margin-top:12px;font-size:13px;color:var(--mute)}
.legend span{display:flex;gap:6px;align-items:center}.legend svg{width:20px;height:20px}
.hint{text-align:center;color:var(--mute);font-size:14px;margin:8px 0 0;min-height:1.5em}
/* modal */
.ov{position:fixed;inset:0;z-index:20;background:#14040ae0;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(4vh,16px) 14px}
.card{width:100%;max-width:620px;margin:auto 0;background:var(--bg2);border-radius:20px;padding:clamp(18px,3vw,28px);box-shadow:0 0 0 2px #f2a0a833,0 30px 60px #000a}
.ctag{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute);margin-bottom:10px}
.ctag b{color:var(--rc,var(--cy));font-weight:500}
.cq{font:500 clamp(18px,2.6vw,22px)/1.35 Rubik,sans-serif;margin:0 0 16px;overflow-wrap:anywhere}
.timer{height:6px;border-radius:3px;background:#ffffff14;margin:-6px 0 16px;overflow:hidden}.timer i{display:block;height:100%;background:var(--cy);width:100%}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;min-height:52px;padding:10px 14px;border-radius:12px;border:0;background:#ffffff10;cursor:pointer;font-size:16px;overflow-wrap:anywhere}
.opt:hover{background:#ffffff1c}
.opt kbd{font:500 12px Rubik;min-width:24px;height:24px;display:grid;place-items:center;border-radius:6px;background:#ffffff1a;color:var(--mute)}
.opt.right{background:color-mix(in srgb,var(--good) 35%,transparent);box-shadow:inset 0 0 0 2px var(--good)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 30%,transparent);box-shadow:inset 0 0 0 2px var(--bad)}
.opt.gone{opacity:.25;pointer-events:none}
.opt[disabled]{cursor:default}
.cfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:16px}
.fb{font-size:15px}.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}
.msg h2{font-size:28px;margin-bottom:8px}.msg p{color:var(--mute);margin:0 0 16px}
.jrow{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:14px;margin:8px 0}
.jlist{list-style:none;padding:0;margin:10px 0 16px;max-height:260px;overflow:auto;font-size:14px}
.jlist li{padding:8px 0;border-bottom:1px solid #ffffff14}.jlist b{color:var(--good);font-weight:500}
.note{font-size:13px;color:var(--mute);text-align:center;margin-top:26px}
@media(max-width:600px){.grid{gap:3px;padding:5px}.tile{border-radius:5px}.jrow{grid-template-columns:90px 1fr auto}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 <p class="note">Cards from the MileDown MCAT Anki deck. Tap a glowing tile or use the arrow keys / WASD to move. Progress saves in this browser.</p>
</div>

<div class="ov" id="ov" hidden><div class="card" id="modal"></div></div>

<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const W=11,H=8,MAXHP=5,MASTER=3;

const REG=[
 {k:'brain',name:'Brain',sub:'Behavioral',col:'#c9a7ff',blurb:'Mind city: psych & soc'},
 {k:'lungs',name:'Lungs',sub:'General Chemistry',col:'#8fd3ff',blurb:'Gas exchange: gen chem'},
 {k:'heart',name:'Heart & Vessels',sub:'Physics and Math',col:'#ff7b8a',blurb:'Pumps & pressure: physics'},
 {k:'liver',name:'Liver',sub:'Organic Chemistry',col:'#ec9a62',blurb:'Reaction factory: orgo'},
 {k:'muscle',name:'Muscle Cell',sub:'Biochemistry',col:'#7be0a5',blurb:'Powerhouse lab: biochem'},
 {k:'gut',name:'Gut & Kidneys',sub:'Biology',col:'#ffd166',blurb:'Systems tour: biology'}
];

/* ---------- icons ---------- */
const IC={
 gate:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4" fill="#f2a0a833" stroke="#f2a0a8" stroke-width="1.5"/><path d="M8 4v16M12 4v16M16 4v16" stroke="#f2a0a8" stroke-width="2"/></svg>',
 bug:'<svg viewBox="0 0 24 24"><g stroke="#ff6b6b" stroke-width="2" stroke-linecap="round"><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3"/></g><circle cx="12" cy="12" r="6" fill="#ff6b6b"/><circle cx="10" cy="11" r="1.4" fill="#2a0a12"/><circle cx="14" cy="11" r="1.4" fill="#2a0a12"/></svg>',
 vial:'<svg viewBox="0 0 24 24"><rect x="5" y="9" width="14" height="7" rx="3.5" transform="rotate(-35 12 12)" fill="#4fe3d6"/><rect x="5" y="9" width="7" height="7" rx="3.5" transform="rotate(-35 12 12)" fill="#fbe9ea"/></svg>',
 core:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffffff14"/><circle cx="12" cy="12" r="7" fill="#ff6b6b"/><circle cx="12" cy="12" r="3.5" fill="#ffd166"/></svg>',
 healed:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#4fe3d6"/><path d="M7.5 12.5l3 3 6-7" stroke="#06302d" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>',
 me:'<svg class="me" viewBox="0 0 24 24"><ellipse cx="12" cy="13" rx="9" ry="7" fill="#4fe3d6"/><ellipse cx="12" cy="11" rx="6" ry="4" fill="#d9fffb"/><circle cx="12" cy="11" r="2" fill="#06302d"/><path d="M4 16l-2 3M20 16l2 3" stroke="#4fe3d6" stroke-width="2" stroke-linecap="round"/></svg>'
};

/* ---------- save ---------- */
const KEY='bodymap_v1';
const fresh=()=>({hp:MAXHP,ins:1,m:{},missed:{},seen:{},r:{}});
let S=fresh();
try{const t=localStorage.getItem(KEY);if(t)S=Object.assign(fresh(),JSON.parse(t))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ---------- cards ---------- */
let cards=[],bySub={};
function initCards(j){
  cards=j.filter(c=>c&&typeof c.q==='string'&&typeof c.a==='string').map(c=>({q:c.q,a:c.a,d:String(c.d),x:Array.isArray(c.x)?c.x:null}));
  bySub={};cards.forEach((c,i)=>(bySub[c.d]||(bySub[c.d]=[])).push(i));
  renderHome();
}
const lastWord=s=>(s.toLowerCase().match(/[a-z]+(?=[^a-z]*$)/)||[''])[0];
const parts=s=>s.split(' / ').length;
const isNum=s=>/^[\d\s.,%°+\-−×x/^()=a-z]{0,12}$/i.test(s)&&/\d/.test(s);
const pickX=c=>Array.isArray(c.x)&&c.x.length?shuffle(c.x.filter(s=>typeof s==='string').slice(0,4)).slice(0,3):null;
function distractors(ci,n){
  const px=pickX(cards[ci]);if(px)return px;
  const card=cards[ci],ca=card.a,lw=lastWord(ca),pa=parts(ca),num=isNum(ca),lower=ca.toLowerCase();
  const src=bySub[card.d]||[];const score=a=>{let sc=Math.random()*2;
    if(lw.length>3&&lastWord(a)===lw)sc+=4;if(parts(a)===pa)sc+=2;if(isNum(a)===num)sc+=num?4:1;
    if((a[0]===a[0].toUpperCase())===(ca[0]===ca[0].toUpperCase()))sc+=1;
    return sc-Math.abs(Math.log((a.length+4)/(ca.length+4)))*3};
  const cands=new Map();
  if(lw.length>3)for(const i of shuffle(src.filter(i=>lastWord(cards[i].a)===lw)).slice(0,30)){const a=cards[i].a;if(a.toLowerCase()!==lower)cands.set(a,score(a)+2)}
  for(let t=0;t<400&&cands.size<90;t++){const a=cards[src[Math.random()*src.length|0]].a;if(a.toLowerCase()!==lower&&!cands.has(a))cands.set(a,score(a))}
  return [...cands].sort((x,y)=>y[1]-x[1]).slice(0,n).map(x=>x[0]);
}
function pickCard(sub,avoid){
  const list=bySub[sub]||[];let best=-1,bs=-1e9;
  for(let t=0;t<120;t++){const i=list[Math.random()*list.length|0];if(avoid&&avoid.has(i))continue;
    const m=S.m[i]||0;let sc=Math.random()*2+(S.seen[i]?0:3)+(m<MASTER?1:-5)-(S.missed[i]?2:0);
    if(sc>bs){bs=sc;best=i}}
  return best;
}

/* ---------- region maps (seeded, layout never saved) ---------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const nb=i=>{const x=i%W,y=i/W|0,o=[];if(x>0)o.push(i-1);if(x<W-1)o.push(i+1);if(y>0)o.push(i-W);if(y<H-1)o.push(i+W);return o};
const MAPS={};
function mapFor(ri){
  if(MAPS[ri])return MAPS[ri];
  const r=rng(1013*(ri+1)+7),N=W*H;
  const start=(H>>1)*W,core=(1+(r()*(H-2)|0))*W+W-1;
  let t;
  for(let attempt=0;;attempt++){
    t=Array.from({length:N},()=>r()<.3?'wall':'path');t[start]=t[core]='path';
    const seen=new Set([start]),q=[start];
    while(q.length){const c=q.shift();for(const n of nb(c))if(t[n]!=='wall'&&!seen.has(n)){seen.add(n);q.push(n)}}
    if(seen.has(core)){for(let i=0;i<N;i++)if(t[i]==='path'&&!seen.has(i))t[i]='wall';break}
    if(attempt>40){let c=start;while(c!==core){const x=c%W,y=c/W|0,cx=core%W,cy=core/W|0;c=(r()<.6&&x<cx)?c+1:(y<cy?c+W:y>cy?c-W:c+1);t[c]='path'}break}
  }
  const open=[...t.keys()].filter(i=>t[i]==='path'&&i!==start&&i!==core);
  for(let i=open.length-1;i>0;i--){const j=r()*(i+1)|0;[open[i],open[j]]=[open[j],open[i]]}
  open.forEach((i,k)=>{const f=k/open.length;t[i]=f<.32?'gate':f<.52?'bug':f<.58?'vial':'path'});
  t[core]='core';
  return MAPS[ri]={t,start,core};
}
function rs(ri){const k=REG[ri].k;if(!S.r[k]){const m=mapFor(ri);S.r[k]={clr:[m.start],pos:m.start,mv:0,inf:{},healed:false}}return S.r[k]}
function explored(ri){const m=mapFor(ri),st=S.r[REG[ri].k];if(!st)return 0;const tot=m.t.filter(x=>x!=='wall').length;return Math.round(st.clr.length/tot*100)}
function mastered(sub){return(bySub[sub]||[]).filter(i=>(S.m[i]||0)>=MASTER).length}

/* ---------- home ---------- */
function bodySvg(){
  const o=(ri,shape)=>{const R=REG[ri],st=S.r[R.k],h=st&&st.healed;const op=.45+Math.min(.55,explored(ri)/100*.55);
    return `<g class="org${h?' healed':''}" data-r="${ri}" tabindex="-1" fill="${R.col}" fill-opacity="${op.toFixed(2)}" stroke="${R.col}" stroke-width="2">${shape}<title>${esc(R.name)}</title></g>`};
  $('bodySvg').innerHTML=`
  <defs><radialGradient id="bg" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#6e2232"/><stop offset="1" stop-color="#3d1019"/></radialGradient></defs>
  <g fill="url(#bg)" stroke="#f2a0a8" stroke-opacity=".35" stroke-width="2">
   <circle cx="150" cy="62" r="46"/><rect x="132" y="102" width="36" height="24" rx="8"/>
   <path d="M88 128Q150 112 212 128Q232 134 236 160L246 300Q248 318 232 318L222 318L214 196L212 330Q214 352 200 360L100 360Q86 352 88 330L86 196L78 318L68 318Q52 318 54 300L64 160Q68 134 88 128Z"/>
   <path d="M102 356L198 356L196 520Q196 532 182 532L164 532Q154 532 154 520L150 400L146 520Q146 532 136 532L118 532Q104 532 104 520Z"/>
  </g>
  ${o(0,'<path d="M114 58Q112 26 150 24Q188 26 186 58Q186 80 150 82Q114 80 114 58Z"/><path d="M150 28V80M128 44Q140 52 132 64M172 44Q160 52 168 64" fill="none" stroke="#2a0a12" stroke-opacity=".4"/>')}
  ${o(1,'<path d="M110 150Q130 140 140 160L140 222Q122 234 106 220Q100 184 110 150Z"/><path d="M190 150Q170 140 160 160L160 222Q178 234 194 220Q200 184 190 150Z"/>')}
  ${o(2,'<path d="M150 214Q132 196 140 184Q148 176 156 186Q164 176 172 184Q178 198 150 214Z" transform="translate(-8 -12)"/><path d="M150 230V346M128 248L100 300M172 248L200 300" fill="none" stroke-width="3" stroke-dasharray="2 5"/>')}
  ${o(3,'<path d="M104 240Q120 226 150 232Q160 236 156 252Q140 266 108 262Q98 252 104 240Z"/>')}
  ${o(4,'<ellipse cx="74" cy="214" rx="11" ry="30" transform="rotate(8 74 214)"/><ellipse cx="226" cy="214" rx="11" ry="30" transform="rotate(-8 226 214)"/>')}
  ${o(5,'<path d="M126 278Q150 266 174 278Q186 300 174 326Q150 340 126 326Q114 300 126 278Z"/><path d="M134 290Q150 282 166 292Q156 304 140 300Q132 312 150 318Q164 316 166 306" fill="none" stroke="#2a0a12" stroke-opacity=".45"/><ellipse cx="178" cy="262" rx="7" ry="11"/><ellipse cx="122" cy="262" rx="7" ry="11"/>')}
  `;
}
function renderHome(){
  bodySvg();
  $('regs').innerHTML=REG.map((R,ri)=>{const st=S.r[R.k],e=explored(ri),n=(bySub[R.sub]||[]).length,mm=mastered(R.sub);
    return `<button class="reg" type="button" data-r="${ri}"><span class="dot" style="background:${R.col}"></span>
      <h3>${esc(R.name)}</h3><small>${esc(R.blurb)}</small>
      <span class="bar" style="grid-column:2"><i style="width:${e}%"></i></span>
      <span class="stat"><span>${st&&st.healed?'<span class="healedTag">Core healed</span>':e+'% charted'}</span><span>${mm}/${n} mastered</span></span></button>`}).join('');
  const tm=cards.filter((_,i)=>(S.m[i]||0)>=MASTER).length,heal=REG.filter(R=>S.r[R.k]&&S.r[R.k].healed).length;
  $('overall').textContent=cards.length?`${tm.toLocaleString()} of ${cards.length.toLocaleString()} cards mastered · ${heal}/6 cores healed`:'Loading cards…';
}
$('regs').addEventListener('click',e=>{const b=e.target.closest('.reg');if(b)enter(+b.dataset.r)});
$('bodySvg').addEventListener('click',e=>{const g=e.target.closest('.org');if(g)enter(+g.dataset.r)});

/* ---------- region ---------- */
let cur=-1,busy=false;
function enter(ri){if(!cards.length)return;cur=ri;rs(ri);save();$('home').hidden=true;$('region').hidden=false;
  const R=REG[ri];document.documentElement.style.setProperty('--rc',R.col);
  $('rName').textContent=R.name;$('rSub').textContent=R.sub;hint('Tap a glowing tile next to you to explore.');renderRegion();window.scrollTo(0,0)}
function leave(){cur=-1;$('region').hidden=true;$('home').hidden=false;renderHome()}
$('backBtn').addEventListener('click',leave);
function hint(t){$('hint').textContent=t}
function hud(){
  $('hp').textContent='♥'.repeat(S.hp)+'♡'.repeat(MAXHP-S.hp);
  $('ins').textContent=`Insight ×${S.ins}`;$('exp').textContent=`${explored(cur)}% charted`;
}
function renderRegion(){
  const m=mapFor(cur),st=rs(cur),clr=new Set(st.clr),vis=new Set();
  st.clr.forEach(c=>{vis.add(c);nb(c).forEach(n=>vis.add(n))});
  const near=new Set(nb(st.pos));
  const g=$('grid');g.style.gridTemplateColumns=`repeat(${W},minmax(0,1fr))`;
  let h='';
  for(let i=0;i<W*H;i++){
    const t=m.t[i],v=vis.has(i),c=clr.has(i),inf=st.inf[i]!==undefined;
    let cls='tile',icon='',label='Unexplored';
    if(v){cls+=' vis';if(t==='wall'){cls+=' wall';label='Tissue wall'}
      else if(inf){cls+=' inf';icon=IC.bug;label='Reinfected tile'}
      else if(c){cls+=' clr';label='Charted';if(t==='core'){icon=IC.healed;label='Healed core'}}
      else{icon=t==='gate'?IC.gate:t==='bug'?IC.bug:t==='vial'?IC.vial:t==='core'?IC.core:'';label={gate:'Membrane gate',bug:'Pathogen',vial:'Supply capsule',core:'Region core',path:'Open tissue'}[t]}}
    const can=near.has(i)&&t!=='wall';
    if(can)cls+=' can';
    if(i===st.pos){icon=IC.me;label='You are here'}
    h+=`<button type="button" class="${cls}" data-i="${i}" aria-label="${label}" ${can?'':'tabindex="-1"'}>${icon}</button>`;
  }
  g.innerHTML=h;hud();
}
$('grid').addEventListener('click',e=>{const b=e.target.closest('.tile');if(b)step(+b.dataset.i)});
document.addEventListener('keydown',e=>{
  if(!$('ov').hidden){modalKey(e);return}
  if(cur<0)return;const p=rs(cur).pos,x=p%W;
  const d={ArrowLeft:x>0?-1:0,a:x>0?-1:0,ArrowRight:x<W-1?1:0,d:x<W-1?1:0,ArrowUp:-W,w:-W,ArrowDown:W,s:W}[e.key];
  if(d){e.preventDefault();const n=p+d;if(n>=0&&n<W*H)step(n)}
});
function step(i){
  if(busy||cur<0)return;
  const m=mapFor(cur),st=rs(cur);
  if(!nb(st.pos).includes(i)||m.t[i]==='wall')return;
  const t=m.t[i],R=REG[cur],cleared=st.clr.includes(i);
  const go=()=>{if(!st.clr.includes(i))st.clr.push(i);st.pos=i;st.mv++;maybeInfect();save();renderRegion()};
  if(st.inf[i]!==undefined){const ci=st.inf[i];
    return ask([ci],{kind:'Reinfection',timed:true,win:()=>{delete st.inf[i];hint('Reinfection cleared. That card is sticking now.');go()}})}
  if(cleared)return go();
  if(t==='path'){hint('');return go()}
  if(t==='vial'){if(S.hp<MAXHP){S.hp++;hint('Supply capsule: +1 health.')}else{S.ins++;hint('Supply capsule: +1 Insight (removes two wrong answers).')}return go()}
  if(t==='gate')return ask([pickCard(R.sub)],{kind:'Membrane gate',timed:false,win:()=>{hint('Gate open.');go()}});
  if(t==='bug')return ask([pickCard(R.sub)],{kind:'Pathogen',timed:true,win:()=>{hint('Pathogen neutralized.');go()}});
  if(t==='core'){const used=new Set(),run=[];for(let k=0;k<5;k++){const c=pickCard(R.sub,used);used.add(c);run.push(c)}
    return ask(run,{kind:'Core',timed:true,boss:true,win:()=>{st.healed=true;go();msg('Core healed!',`${R.name} is healed. Keep charting to master the rest of ${R.sub}, or head back to the body.`,[['Keep exploring',closeModal],['Back to body',()=>{closeModal();leave()}]])}})}
}
function maybeInfect(){
  const st=rs(cur),m=mapFor(cur);
  if(st.mv%9!==0)return;
  const sub=REG[cur].sub,infd=new Set(Object.values(st.inf));
  const missed=(bySub[sub]||[]).filter(i=>S.missed[i]&&!infd.has(i));
  if(!missed.length)return;
  const spots=st.clr.filter(i=>i!==st.pos&&i!==m.start&&i!==m.core&&st.inf[i]===undefined);
  if(!spots.length)return;
  st.inf[spots[Math.random()*spots.length|0]]=missed[Math.random()*missed.length|0];
  hint('A card you missed has reinfected a charted tile.');
}

/* ---------- challenge modal ---------- */
let Q=null;
function ask(list,opt){busy=true;Q={list,k:0,opt};showQ()}
function showQ(){
  const ci=Q.list[Q.k],c=cards[ci],R=REG[cur];S.seen[ci]=1;
  const opts=shuffle([c.a,...distractors(ci,3)]);
  Q.ci=ci;Q.opts=opts;Q.done=false;
  const prog=Q.opt.boss?`Core ${Q.k+1}/${Q.list.length}`:'';
  $('modal').innerHTML=`<div class="ctag"><b>${esc(Q.opt.kind)}</b><span>${esc(prog||R.sub)}</span></div>
    <p class="cq" id="cq"></p>${Q.opt.timed?'<div class="timer"><i id="tbar"></i></div>':''}
    <div class="opts" id="opts">${opts.map((a,i)=>`<button type="button" class="opt" data-i="${i}"><kbd>${i+1}</kbd><span></span></button>`).join('')}</div>
    <div class="cfoot"><span class="fb" id="fb"></span><span>
    <button class="btn ghost" id="insBtn" type="button" ${S.ins?'':'disabled'}>Use Insight (${S.ins})</button>
    <button class="btn" id="contBtn" type="button" hidden>Continue</button></span></div>`;
  $('cq').textContent=c.q;
  [...$('opts').children].forEach((b,i)=>b.querySelector('span').textContent=opts[i]);
  $('opts').addEventListener('click',e=>{const b=e.target.closest('.opt');if(b)answer(+b.dataset.i)});
  $('insBtn').addEventListener('click',useInsight);
  $('contBtn').addEventListener('click',cont);
  $('ov').hidden=false;$('opts').children[0].focus();
  clearInterval(Q.tm);
  if(Q.opt.timed){const T=Q.opt.boss?16:20,t0=performance.now();
    Q.tm=setInterval(()=>{const f=1-(performance.now()-t0)/1000/T;const b=$('tbar');if(b)b.style.width=Math.max(0,f*100)+'%';if(f<=0){clearInterval(Q.tm);answer(-1)}},100)}
}
function useInsight(){if(!S.ins||Q.done)return;S.ins--;save();
  const ci=cards[Q.ci].a;let n=0;[...$('opts').children].forEach((b,i)=>{if(n<2&&Q.opts[i]!==ci&&!b.classList.contains('gone')){b.classList.add('gone');n++}});
  $('insBtn').disabled=true;$('insBtn').textContent=`Use Insight (${S.ins})`;hud()}
function answer(i){
  if(Q.done)return;Q.done=true;clearInterval(Q.tm);
  const c=cards[Q.ci],ok=i>=0&&Q.opts[i]===c.a,bs=[...$('opts').children];
  bs.forEach((b,k)=>{b.disabled=true;if(Q.opts[k]===c.a)b.classList.add('right');else if(k===i)b.classList.add('wrong')});
  $('insBtn').hidden=true;
  if(ok){S.m[Q.ci]=(S.m[Q.ci]||0)+1;delete S.missed[Q.ci];
    const mm=S.m[Q.ci]>=MASTER;$('fb').className='fb ok';$('fb').textContent=mm&&S.m[Q.ci]===MASTER?'Correct, card mastered!':'Correct!';
    Q.ok=true;save();
    if(Q.opt.boss&&Q.k<Q.list.length-1){$('contBtn').hidden=false;$('contBtn').textContent='Next';$('contBtn').focus()}
    else setTimeout(cont,650);
  } else {
    S.m[Q.ci]=Math.max(0,(S.m[Q.ci]||0)-1);S.missed[Q.ci]=1;S.hp--;Q.ok=false;save();hud();
    $('fb').className='fb no';$('fb').textContent=i<0?'Out of time. −1 health':'Not quite. −1 health';
    $('contBtn').hidden=false;$('contBtn').textContent='Got it';$('contBtn').focus();
  }
}
function cont(){
  if(!Q)return;
  if(Q.ok&&Q.opt.boss&&Q.k<Q.list.length-1){Q.k++;return showQ()}
  const opt=Q.opt,ok=Q.ok;closeModal();
  if(ok)opt.win();
  else{
    if(opt.boss)hint('The core resisted. Try again with fresh cards.');
    else hint('Missed cards come back later as reinfections.');
    if(S.hp<=0)blackout();else renderRegion();
  }
}
function blackout(){const st=rs(cur),m=mapFor(cur);S.hp=MAXHP;st.pos=m.start;save();renderRegion();
  msg('You blacked out','You drifted back to the region entrance with full health. Everything you charted is still charted.',[['Continue',closeModal]])}
function closeModal(){clearInterval(Q&&Q.tm);Q=null;busy=false;$('ov').hidden=true;$('modal').innerHTML=''}
function msg(title,body,btns){busy=true;
  $('modal').innerHTML=`<div class="msg"><h2></h2><p></p><div class="cfoot" style="justify-content:flex-start">${btns.map((b,i)=>`<button type="button" class="btn${i?' ghost':''}" data-b="${i}">${esc(b[0])}</button>`).join('')}</div></div>`;
  $('modal').querySelector('h2').textContent=title;$('modal').querySelector('p').textContent=body;
  $('modal').querySelectorAll('[data-b]').forEach(el=>el.addEventListener('click',()=>btns[+el.dataset.b][1]()));
  $('ov').hidden=false;$('modal').querySelector('.btn').focus();
}
function modalKey(e){
  if(Q&&!Q.done){const n=+e.key;if(n>=1&&n<=Q.opts.length){e.preventDefault();const b=$('opts').children[n-1];if(!b.classList.contains('gone'))answer(n-1)}}
  else if(e.key==='Escape'&&!Q){closeModal()}
}

/* ---------- journal ---------- */
function journal(){
  busy=true;
  const rows=REG.map(R=>{const n=(bySub[R.sub]||[]).length,mm=mastered(R.sub);
    return `<div class="jrow"><span>${esc(R.sub)}</span><span class="bar"><i style="width:${n?mm/n*100:0}%;background:${R.col}"></i></span><span>${mm}/${n}</span></div>`}).join('');
  const miss=Object.keys(S.missed).map(Number).filter(i=>cards[i]);
  $('modal').innerHTML=`<div class="msg"><h2>Journal</h2><p>A card is mastered after ${MASTER} correct answers. Missed cards return as reinfections in their region.</p>${rows}
   <h3 style="margin-top:18px;font-size:18px">To review (${miss.length})</h3>
   <ul class="jlist">${miss.length?miss.slice(0,200).map(i=>`<li>${esc(cards[i].q)} → <b>${esc(cards[i].a)}</b></li>`).join(''):'<li>Nothing missed yet.</li>'}</ul>
   <div class="cfoot" style="justify-content:flex-start"><button class="btn" id="jClose" type="button">Close</button><button class="btn ghost" id="jReset" type="button">Reset progress</button></div></div>`;
  $('jClose').addEventListener('click',()=>{closeModal();renderHome()});
  $('jReset').addEventListener('click',e=>{const b=e.currentTarget;if(b.dataset.arm){S=fresh();save();closeModal();renderHome()}else{b.dataset.arm=1;b.textContent='Tap again to erase everything'}});
  $('ov').hidden=false;$('jClose').focus();
}
$('journalBtn').addEventListener('click',journal);

/* ---------- boot ---------- */
renderHome();
const emb=document.getElementById('cardsData');
(emb?Promise.resolve(JSON.parse(emb.textContent)):fetch('cards.json').then(r=>r.json()))
 .then(initCards).catch(()=>{$('overall').textContent='Couldn’t load the cards.'});
}
</script>
</body>
</html>
